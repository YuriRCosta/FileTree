name: Bug
description: Something in FileTree is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        FileTree is in beta. Reproduction steps are the most useful thing you can send.
        For a security issue, follow SECURITY.md instead of opening an issue.

  - type: input
    id: versions
    attributes:
      label: Versions
      description: FileTree version, Omarchy version, and `hyprctl version | head -1`
      placeholder: "e.g. FileTree 0.1.0, Omarchy 4.2.0, Hyprland 0.52.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where?
      options:
        - Build or install
        - File tree, search, or file operations
        - Blade window, focus, keybinds, or docking
        - Notes module
        - Companion module (skills, memory, hooks, MCP, git)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got
      placeholder: |
        1. ...
        2. ...
        Expected: ...
        Got: ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: Relevant lines from `omarchy-shell -q data-goblin.fileblade status`, the shell log, or a build error. Screenshots help for anything visual.
      render: shell
