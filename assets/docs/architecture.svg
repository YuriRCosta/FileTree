<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/></marker></defs>
  <rect width="960" height="470" fill="#0d1117"/>
  <rect x="20" y="20" width="920" height="160" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="36" y="46" fill="#e6edf3" font-weight="bold">Quickshell process (omarchy-shell)</text>
  <text x="36" y="66" fill="#8b949e" font-size="12">Service.qml, one resident QML instance</text>
  <rect x="36" y="82" width="218" height="82" rx="6" fill="#1f2630" stroke="#3d444d"/>
  <text x="48" y="104" fill="#e6edf3">BladeHost</text>
  <text x="48" y="126" fill="#8b949e" font-size="12">layout, blades.json,</text>
  <text x="48" y="146" fill="#8b949e" font-size="12">focus routing, registry</text>
  <rect x="266" y="82" width="218" height="82" rx="6" fill="#1f2630" stroke="#3d444d"/>
  <text x="278" y="104" fill="#e6edf3">BladeSurface x2</text>
  <text x="278" y="126" fill="#8b949e" font-size="12">PanelWindow per edge,</text>
  <text x="278" y="146" fill="#8b949e" font-size="12">slots, tabs, drag</text>
  <rect x="496" y="82" width="218" height="82" rx="6" fill="#1f2630" stroke="#3d444d"/>
  <text x="508" y="104" fill="#e6edf3">Modules</text>
  <text x="508" y="126" fill="#8b949e" font-size="12">files, properties,</text>
  <text x="508" y="146" fill="#8b949e" font-size="12">notes, plugin blades</text>
  <rect x="726" y="82" width="218" height="82" rx="6" fill="#1f2630" stroke="#3d444d"/>
  <text x="738" y="104" fill="#e6edf3">Controllers</text>
  <text x="738" y="126" fill="#8b949e" font-size="12">tree, search, ops,</text>
  <text x="738" y="146" fill="#8b949e" font-size="12">watch, trash, state</text>
  <line x1="440" y1="180" x2="440" y2="250" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="480" y1="250" x2="480" y2="180" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="500" y="210" fill="#8b949e" font-size="12">JSON lines over stdin and stdout</text>
  <text x="500" y="230" fill="#8b949e" font-size="12">request, response, progress, event</text>
  <rect x="20" y="250" width="880" height="120" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="36" y="276" fill="#e6edf3" font-weight="bold">filetree serve: Rust resident backend, child of the shell</text>
  <text x="36" y="298" fill="#8b949e" font-size="12">listing, index and search, git status, file operations, trash, journal, audit, inotify watches</text>
  <rect x="36" y="314" width="848" height="40" rx="6" fill="#1f2630" stroke="#3d444d"/>
  <text x="48" y="339" fill="#8b949e" font-size="12">bounded line size, response bytes, deadline, concurrency, watch paths; exits with its parent</text>
  <rect x="20" y="400" width="450" height="50" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="36" y="430" fill="#e6edf3">filetree CLI (you, scripts, agents)</text>
  <rect x="490" y="400" width="450" height="50" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="506" y="430" fill="#e6edf3">omarchy-shell IPC: yuricosta.filetree</text>
  <line x1="470" y1="425" x2="490" y2="425" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="920" y1="400" x2="920" y2="180" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <line x1="245" y1="400" x2="245" y2="370" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
