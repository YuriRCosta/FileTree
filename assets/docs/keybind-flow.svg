<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/></marker></defs>
  <rect width="960" height="230" fill="#0d1117"/>
  <text x="20" y="30" fill="#e6edf3" font-weight="bold">A blade-aware keybind, for example Super+W</text>
  <rect x="20" y="50" width="200" height="90" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="32" y="74" fill="#e6edf3">Hyprland bind</text>
  <text x="32" y="96" fill="#8b949e" font-size="12">your hypr config</text>
  <text x="32" y="116" fill="#8b949e" font-size="12">bindings.lua</text>
  <line x1="220" y1="95" x2="260" y2="95" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="260" y="50" width="200" height="90" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="272" y="74" fill="#e6edf3">omarchy-shell -q</text>
  <text x="272" y="96" fill="#8b949e" font-size="12">...filetree.control</text>
  <text x="272" y="116" fill="#8b949e" font-size="12">0.4 s timeout</text>
  <line x1="460" y1="95" x2="500" y2="95" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="500" y="50" width="200" height="90" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="512" y="74" fill="#e6edf3">FileTreeIpc.qml</text>
  <text x="512" y="96" fill="#8b949e" font-size="12">windowClose</text>
  <text x="512" y="116" fill="#8b949e" font-size="12">blade focused? yes</text>
  <line x1="700" y1="95" x2="740" y2="95" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="740" y="50" width="200" height="90" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="752" y="74" fill="#e6edf3">BladeHost</text>
  <text x="752" y="96" fill="#8b949e" font-size="12">closes the blade,</text>
  <text x="752" y="116" fill="#8b949e" font-size="12">releases focus grab</text>
  <line x1="600" y1="140" x2="600" y2="170" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <rect x="260" y="170" width="680" height="44" rx="6" fill="#1f2630" stroke="#3d444d" stroke-dasharray="4 3"/>
  <text x="272" y="197" fill="#8b949e" font-size="12">no blade focused, shell down, or timeout: || hyprctl dispatch killactive (plain Hyprland)</text>
</svg>
