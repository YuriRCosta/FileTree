[demo]
name             = "readme-03-dock"
output           = "WAYLAND-1"
capture          = "screencopy"
screen           = [1920, 1080]
region           = { x = 0, y = 0, w = 1920, h = 1080 }
leading_blank_ms = 900
show_keys        = true
fps              = 30
settle_ms        = 1200
gif_fps          = 12
gif_width        = 1280

[cursor]
size    = 26
fill    = "#c0caf5"
outline = "#0e0e14"

[cursor.ripple]
style       = "pixel"
pixel_size  = 6
radius      = 46
duration_ms = 620
color       = "#7aa2f7"

[keys]
fill = "#7aa2f7"
text = "#0e0e14"
size = 34

[points]
idle = [1100, 900]

[[step]]
kind = "move"
to = "idle"
ms = 1

[[step]]
kind = "ipc"
target = "yuricosta.filetree.control"
method = "focusLeft"

[[step]]
kind = "hold"
ms = 1600

[[step]]
kind = "zoom"
to = [0, 0, 1280, 720]
ease = "ease_in_out"
ms = 900

[[step]]
kind = "annotate"
text = "Docked, the blade reserves its strip and your windows make room"
ms = 3400

[[step]]
kind = "hold"
ms = 3400

[[step]]
kind = "annotate"
text = "Super+T pops it out into an ordinary Hyprland window"
ms = 4200

[[step]]
kind = "hold"
ms = 1400

[[step]]
kind = "ipc"
target = "yuricosta.filetree.control"
method = "windowToggle"

[[step]]
kind = "hold"
ms = 1200

[[step]]
kind = "zoom"
to = [640, 0, 1280, 720]
ease = "ease_in_out"
ms = 900

[[step]]
kind = "hold"
ms = 1600

[[step]]
kind = "annotate"
text = "It is an ordinary Hyprland window now: focus, swap, resize, close"
ms = 3000

[[step]]
kind = "hold"
ms = 3000

[[step]]
kind = "zoom"
to = [0, 0, 1280, 720]
ease = "ease_in_out"
ms = 900

[[step]]
kind = "annotate"
text = "Super+T again and it docks back to the edge"
ms = 3600

[[step]]
kind = "hold"
ms = 1000

[[step]]
kind = "ipc"
target = "yuricosta.filetree.control"
method = "windowToggle"

[[step]]
kind = "hold"
ms = 3000
