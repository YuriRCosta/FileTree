# Overview on the live seat, workspace 3, captions at the bottom. Both blades
# open, the left blade tour (tree, git, sort, colour, search, quick nav,
# properties), the right blade tour (skills, disable one, filter by agent,
# memory by tokens), then both close. The pointer parks inside the blade, off the
# text, while words are typed (keyboard focus follows the pointer out of a blade;
# a tooltip or the cursor would cover the field), and every zoom keeps the
# pointer in the picture (democtl refuses the script otherwise).
#
# Prepare before recording (points assume DP-1 at 2560x1440, scale 1, blades at
# their saved widths 522 left and 492 right, slots at their saved fractions):
#   hyprctl eval 'hl.monitor({ output = "DP-1", mode = "2560x1440@60", position = "auto", scale = 1 })'
#   hyprctl dispatch "hl.dsp.focus({ workspace = \"3\" })"   (an empty workspace)
#   omarchy-shell yuricosta.filetree.control setRoot "$HOME/git/filetree"
#   omarchy-shell yuricosta.filetree.control clearSearch && omarchy-shell yuricosta.filetree.control setSearchDeep false
#   omarchy-shell yuricosta.filetree.control setBladeTab right 0 0
#   omarchy-shell yuricosta.filetree.control setBladeTab right 1 0
#   omarchy-shell yuricosta.filetree.control collapsePath "$HOME/git/filetree/demos"
#   clear the skills filter (it persists in blade state): search icon, Ctrl+A, BackSpace, Escape
#   filetree blade close left && filetree blade close right
#   democtl doctor                     (positioning error must be 0)
# The take disables the test-omarchy-plugin skill and colours the assets folder;
# restore and clear afterwards (bin ids come from `filetree _backend bin-list --module skills`):
#   filetree _backend bin-restore --module skills --id bin:<dir>
#   omarchy-shell yuricosta.filetree.control clearFolderColor "$HOME/git/filetree/assets"

[demo]
name             = "overview"
output           = "DP-1"
screen           = [2560, 1440]
region           = { x = 0, y = 0, w = 2560, h = 1440 }
portal           = false
leading_blank_ms = 1500
show_keys        = false
fps              = 30
settle_ms        = 1400
gif              = false

[cursor]
size    = 28
fill    = "#c0caf5"
outline = "#0e0e14"

[cursor.ripple]
style       = "pixel"
pixel_size  = 6
radius      = 52
duration_ms = 620
color       = "#7aa2f7"

[caption]
size       = 76
fill       = "#e6e6f0"
background = "#12101a"
font       = "JetBrains Mono Nerd Font"

[points]
